version: 2
updates:
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "weekly"
- package-ecosystem: "gomod"
  directory: /
  schedule:
    interval: "weekly"
  groups:
    steadybit:
      patterns:
        - "github.com/steadybit/*"
- package-ecosystem: "docker"
  directory: "/"
  schedule:
    interval: "weekly"
