name: "CLA Assistant"
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened,closed,synchronize]

jobs:
  call-workflow:
    uses: steadybit/.github/.github/workflows/cla.yml@main # NOSONAR githubactions:S7637 - our own action
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.GH_APP_STEADYBIT_PRIVATE_KEY }}
